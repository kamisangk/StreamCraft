<!DOCTYPE html>
<html th:lang="${currentLocaleTag}" lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/app-shell :: commonHead(#{monitorDetail.title})}">
    <title>Pipeline monitor - StreamCraft</title>
</head>
<body class="sc-shell-page min-h-[100dvh] w-screen flex flex-col overflow-hidden">
<div id="studio-bootstrap"
     class="hidden"
     data-page-mode="monitor"
     th:attr="data-pipeline-id=${pipelineId}">
</div>

<header data-monitor-shell="readonly" class="sc-card-strong rounded-none border-x-0 border-t-0 min-h-16 px-4 lg:px-6 py-3 flex items-center justify-between gap-4 shrink-0">
    <div class="flex items-center gap-4 min-w-0">
        <a th:href="@{/main}" class="sc-btn-icon shrink-0" th:aria-label="#{monitorDetail.back}" aria-label="Back to main dashboard">
            <i data-lucide="arrow-left" class="sc-icon sc-icon-sm" aria-hidden="true"></i>
        </a>
        <div class="min-w-0">
            <div class="flex items-center gap-3 min-w-0">
                <h1 id="studio-title" class="sc-section-head text-base lg:text-lg truncate" th:text="#{monitorDetail.title}">Pipeline monitor</h1>
                <span id="studio-status" class="sc-pill" th:text="#{monitorDetail.status.loading}">Loading</span>
            </div>
            <p class="sc-topbar-subtitle mt-1 truncate" th:text="#{monitorDetail.subtitle}">Readonly DAG canvas with live task state.</p>
        </div>
    </div>
    <div data-monitor-toolbar="actions" class="flex items-center gap-2 sm:gap-3 shrink-0">
        <div class="hidden sm:block sc-surface px-3 py-2 text-xs text-[var(--sc-muted)]">
            <span class="sc-subtle-label text-[10px] tracking-[0.18em]" th:text="#{monitorDetail.refresh.label}">Refresh</span>
            <div id="monitor-last-refresh" class="mt-1 sc-code text-xs text-[var(--sc-text-body)]" th:text="#{monitorDetail.lastRefresh.placeholder}">Last refresh: --</div>
        </div>
        <button id="refresh-button" type="button" class="sc-btn-secondary px-3 sm:px-4 py-2 text-xs">
            <i data-lucide="refresh-cw" class="sc-icon sc-icon-sm" aria-hidden="true"></i>
            <span th:text="#{monitorDetail.refresh}">Refresh</span>
        </button>
    </div>
</header>

<main id="canvas-container" class="flex-1 canvas-bg relative overflow-hidden">
    <div id="studio-message" class="hidden absolute top-4 left-4 right-4 md:right-auto md:w-[420px] sc-card-strong border px-4 py-3 text-sm z-40 shadow-xl"></div>
    <div id="canvas-drop-zone" class="absolute inset-0">
        <svg id="edges-layer" class="absolute inset-0 w-full h-full pointer-events-none z-0">
            <path id="temp-connection-path" fill="none" stroke="#60a5fa" stroke-width="2.5" class="opacity-0"></path>
        </svg>
        <div id="nodes-layer" class="absolute inset-0 z-10"></div>
    </div>
</main>

<style>
    .canvas-bg { background: var(--sc-bg); background-image: linear-gradient(var(--sc-border-soft) 1px, transparent 1px), linear-gradient(90deg, var(--sc-border-soft) 1px, transparent 1px); background-size: 44px 44px; }
    .node-port { position: absolute; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; border-radius: 999px; background: var(--sc-accent); border: 2px solid var(--sc-bg); box-shadow: 0 0 0 3px var(--sc-accent-soft); }
    .port-left { left: -6px; }
    .port-right { right: -6px; }
    .port-stack { position: absolute; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 16px; }
    .port-stack .node-port { position: static; top: auto; transform: none; }
    .port-stack .port-right, .port-stack .port-left { right: auto; left: auto; }
    .port-right-stack { right: -6px; align-items: flex-end; }
    .port-left-stack { left: -6px; align-items: flex-start; }
    .port-stack-item { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
    .port-stack-item-left { justify-content: flex-start; }
    .port-label { max-width: 96px; overflow: hidden; padding: 3px 5px; border: 1px solid var(--sc-border); border-radius: 5px; background: var(--sc-card-strong); color: var(--sc-muted); font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 600; line-height: 1; text-overflow: ellipsis; white-space: nowrap; }
    .drag-handle { cursor: grab; }
    .drag-handle:active { cursor: grabbing; }
    .draggable-node { position: absolute; width: 236px; transition: box-shadow .2s ease, border-color .2s ease; }
    .studio-node-card { border-color: var(--sc-border); background: var(--sc-card-strong); box-shadow: var(--sc-shadow-soft); }
    .studio-node-header { min-height: 44px; background: var(--sc-surface); border-color: var(--sc-border); }
    .studio-node-badge { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; border: 1px solid currentColor; border-radius: 7px; }
    .studio-node-body { min-height: 74px; background: var(--sc-card-strong); }
    .studio-node-type { color: var(--sc-muted); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .studio-edge-path { stroke-linecap: round; stroke-linejoin: round; opacity: .72; }
    .studio-edge-path-selected { stroke: var(--sc-warning); opacity: 1; stroke-width: 3.5; }
    .studio-edge-preview { stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 5; }
    .draggable-node.node-active { border-color: var(--sc-accent); box-shadow: 0 0 0 3px var(--sc-accent-soft), 0 16px 32px rgba(13,23,40,.18); z-index: 30; }
</style>

<script th:src="@{/js/pipeline-port-contract.js}" src="/js/pipeline-port-contract.js"></script>
<script th:src="@{/js/studio-editor.js}" src="/js/studio-editor.js"></script>
</body>
</html>
