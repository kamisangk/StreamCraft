<!DOCTYPE html>
<html th:lang="${currentLocaleTag}" lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/app-shell :: commonHead(#{login.documentTitle})}">
    <title th:text="#{login.documentTitle} + ' - StreamCraft'">Login - StreamCraft</title>
</head>
<body class="sc-shell-page sc-login-page min-h-[100dvh] w-screen flex items-center justify-center overflow-auto relative px-4 py-8 sm:py-12">
    <div data-login-language-switcher class="login-language-wrap absolute top-4 right-4 sm:top-6 sm:right-6 z-20">
        <span id="login-language-label" class="sr-only" th:text="#{language.switcher.label}">Language</span>
        <select id="login-language-select"
                data-language-select
                class="sc-language-select login-language-select"
                tabindex="-1"
                aria-hidden="true"
                th:aria-label="#{language.switcher.label}"
                aria-label="Language">
            <option value="zh-CN" th:selected="${currentLocaleTag == 'zh-CN'}" th:text="#{language.zhCN}">简体中文</option>
            <option value="en-US" th:selected="${currentLocaleTag == 'en-US'}" th:text="#{language.enUS}">English</option>
        </select>
        <div class="login-language-control">
            <button id="login-language-trigger"
                    type="button"
                    data-language-trigger
                    class="login-language-trigger"
                    aria-haspopup="listbox"
                    aria-expanded="false"
                    aria-controls="login-language-menu"
                    aria-labelledby="login-language-label">
                <i data-lucide="languages" class="sc-icon sc-icon-sm login-language-trigger-icon" aria-hidden="true"></i>
                <span data-language-current class="login-language-current" th:if="${currentLocaleTag == 'zh-CN'}" th:text="#{language.zhCN}">简体中文</span>
                <span data-language-current class="login-language-current" th:if="${currentLocaleTag == 'en-US'}" th:text="#{language.enUS}">English</span>
                <span data-language-current class="login-language-current" th:unless="${currentLocaleTag == 'zh-CN' or currentLocaleTag == 'en-US'}" th:text="#{language.zhCN}">简体中文</span>
                <i data-lucide="chevron-down" class="sc-icon sc-icon-sm login-language-chevron" aria-hidden="true"></i>
            </button>
            <div id="login-language-menu"
                 data-language-menu
                 class="login-language-menu"
                 role="listbox"
                 aria-labelledby="login-language-label"
                 tabindex="-1"
                 hidden>
                <button type="button"
                        class="login-language-option"
                        role="option"
                        data-language-option="zh-CN"
                        th:attr="aria-selected=${currentLocaleTag == 'zh-CN'}">
                    <span th:text="#{language.zhCN}">简体中文</span>
                    <i data-lucide="check" class="sc-icon sc-icon-sm login-language-option-check" aria-hidden="true"></i>
                </button>
                <button type="button"
                        class="login-language-option"
                        role="option"
                        data-language-option="en-US"
                        th:attr="aria-selected=${currentLocaleTag == 'en-US'}">
                    <span th:text="#{language.enUS}">English</span>
                    <i data-lucide="check" class="sc-icon sc-icon-sm login-language-option-check" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>
    <div class="login-shell relative w-full max-w-6xl grid md:grid-cols-[0.9fr_1.1fr] sc-card-strong overflow-hidden min-h-[560px]">
        <div class="login-hero hidden md:flex bg-[var(--sc-surface)] p-10 lg:p-14 flex-col relative border-r border-[var(--sc-border)] overflow-hidden">
            <div class="login-hero-grid absolute inset-0" aria-hidden="true"></div>

            <div class="login-hero-content relative z-10 flex h-full flex-col">
                <div class="login-brand flex items-center mb-16">
                    <img th:src="@{/brand-logo.png}" src="/brand-logo.png" alt="StreamCraft"
                         class="login-brand-mark h-11 w-11 rounded-xl object-cover ring-1 ring-black/5 mr-3">
                    <span class="text-2xl font-bold tracking-tight text-[var(--sc-text)]">StreamCraft</span>
                </div>

                <h1 class="max-w-xl text-4xl lg:text-5xl font-bold tracking-tight text-[var(--sc-text)] leading-[1.02] mb-6">
                    <span th:text="#{login.hero.title.line1}">Build the next</span><br>
                    <span th:text="#{login.hero.title.line2}">real-time data pipeline</span>
                </h1>
                <p class="max-w-md text-sm leading-7 text-[var(--sc-muted)]" th:text="#{login.hero.description}">
                    A fast, modern, visual enterprise console for Flink stream-processing scheduling and orchestration.
                </p>

            </div>
        </div>

        <div class="login-panel w-full px-7 py-12 sm:px-12 md:px-16 flex flex-col justify-center bg-[var(--sc-card-strong)]">
            <div class="login-mobile-brand md:hidden" aria-label="StreamCraft">
                <img th:src="@{/brand-logo.png}" src="/brand-logo.png" alt="StreamCraft" class="login-brand-mark h-10 w-10 rounded-xl object-cover">
                <span class="text-lg font-bold text-[var(--sc-text)]">StreamCraft</span>
            </div>
            <div class="mb-10 max-w-md">
                <h2 class="text-3xl lg:text-4xl font-bold tracking-tight text-[var(--sc-text)] mb-2" th:text="#{login.title}">Welcome back</h2>
                <p class="text-sm text-[var(--sc-muted)]" th:text="#{login.subtitle}">Sign in to your StreamCraft workspace</p>
            </div>

            <div class="mb-6 space-y-3">
                <div th:if="${param.error != null}" class="login-alert rounded-xl border border-red-200 bg-red-50 dark:bg-red-500/10 px-4 py-3 text-sm text-red-700 dark:text-red-200" role="alert" th:text="#{login.error.invalidCredentials}">
                    Invalid username or password
                </div>
                <div th:if="${param.logout != null}" class="login-alert rounded-xl border border-emerald-200 bg-emerald-50 dark:bg-emerald-500/10 px-4 py-3 text-sm text-emerald-700 dark:text-emerald-200" role="status" th:text="#{login.logout.success}">
                    You have signed out
                </div>
            </div>

            <form class="login-form space-y-6" th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div>
                    <label for="username" class="block text-sm font-medium text-[var(--sc-text-body)] mb-1.5" th:text="#{login.username.label}">Account / Email</label>
                    <div class="sc-input-icon-wrap login-input-wrap">
                        <i data-lucide="at-sign" class="sc-icon sc-icon-sm" aria-hidden="true"></i>
                        <input type="text" id="username" name="username" th:value="${param.username != null ? param.username[0] : ''}" class="sc-input login-input px-4 py-3 text-sm" th:placeholder="#{login.username.placeholder}" placeholder="admin@example.com">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-[var(--sc-text-body)] mb-1.5" th:text="#{login.password.label}">Password</label>
                    <div class="sc-input-icon-wrap login-input-wrap">
                        <i data-lucide="key-round" class="sc-icon sc-icon-sm" aria-hidden="true"></i>
                        <input type="password" id="password" name="password" class="sc-input login-input px-4 py-3 text-sm" th:placeholder="#{login.password.placeholder}" placeholder="Enter your password">
                    </div>
                </div>

                <div class="login-remember flex items-center">
                    <input type="checkbox" id="remember" name="remember-me" class="login-checkbox w-4 h-4 rounded border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-[var(--sc-accent)] focus:ring-blue-500/50 cursor-pointer">
                    <label for="remember" class="ml-2 text-sm text-[var(--sc-muted)] cursor-pointer" th:text="#{login.rememberMe}">Keep me signed in</label>
                </div>

                <button type="submit" class="login-submit sc-btn-primary w-full py-3 px-4 text-sm mt-4">
                    <i data-lucide="arrow-right" class="sc-icon sc-icon-sm" aria-hidden="true"></i>
                    <span th:text="#{login.submit}">Sign in</span>
                </button>
            </form>
        </div>
    </div>
    <style>
        .sc-login-page {
            --login-panel-line: color-mix(in srgb, var(--sc-border) 74%, transparent);
            background-color: var(--sc-bg);
            background-image: linear-gradient(135deg, color-mix(in srgb, var(--sc-accent) 5%, transparent), transparent 42%);
        }

        .login-language-wrap {
            position: absolute;
            display: inline-flex;
            align-items: center;
        }

        .login-language-control {
            position: relative;
        }

        .login-language-select {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .login-language-trigger {
            display: inline-flex;
            min-width: 156px;
            min-height: 44px;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border: 1px solid var(--sc-border);
            border-radius: 10px;
            background: color-mix(in srgb, var(--sc-card-strong) 92%, var(--sc-accent) 8%);
            color: var(--sc-text-body);
            box-shadow: 0 10px 24px rgba(13, 23, 40, 0.08);
            font-size: 13px;
            font-weight: 600;
            line-height: 1.2;
            text-align: left;
            transition: border-color 180ms ease, color 180ms ease, box-shadow 180ms ease;
        }

        .login-language-trigger:hover,
        .login-language-trigger[aria-expanded="true"] {
            border-color: color-mix(in srgb, var(--sc-accent) 48%, var(--sc-border) 52%);
            color: var(--sc-text);
        }

        .login-language-trigger:focus-visible {
            outline: 2px solid var(--sc-accent);
            outline-offset: 3px;
            box-shadow: 0 0 0 4px var(--sc-focus-ring);
        }

        .login-language-trigger-icon {
            flex: 0 0 auto;
            color: var(--sc-muted);
        }

        .login-language-current {
            min-width: 0;
            flex: 1 1 auto;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .login-language-chevron {
            flex: 0 0 auto;
            color: var(--sc-muted);
            transition: transform 180ms ease;
        }

        .login-language-trigger[aria-expanded="true"] .login-language-chevron {
            transform: rotate(180deg);
        }

        .login-language-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            z-index: 30;
            min-width: 156px;
            padding: 5px;
            border: 1px solid var(--sc-border);
            border-radius: 10px;
            background: var(--sc-card-strong);
            box-shadow: var(--sc-shadow);
        }

        .login-language-option {
            display: flex;
            width: 100%;
            min-height: 38px;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 8px 9px;
            border: 1px solid transparent;
            border-radius: 7px;
            color: var(--sc-text-body);
            font-size: 13px;
            font-weight: 500;
            line-height: 1.3;
            text-align: left;
            white-space: nowrap;
            transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
        }

        .login-language-option:hover,
        .login-language-option:focus-visible,
        .login-language-option[data-active="true"] {
            border-color: var(--sc-border-soft);
            background: var(--sc-surface);
            color: var(--sc-text);
            outline: none;
        }

        .login-language-option[aria-selected="true"] {
            color: var(--sc-accent);
            font-weight: 600;
        }

        .login-language-option-check {
            visibility: hidden;
            color: var(--sc-accent);
        }

        .login-language-option[aria-selected="true"] .login-language-option-check {
            visibility: visible;
        }

        .login-language-wrap:focus-within .login-language-trigger-icon {
            color: var(--sc-accent);
        }

        .login-shell {
            min-height: 620px;
            border-radius: 18px;
            border-color: color-mix(in srgb, var(--sc-border) 82%, var(--sc-accent) 18%);
            box-shadow: 0 30px 80px rgba(13, 23, 40, 0.18), 0 0 0 1px color-mix(in srgb, var(--sc-accent) 10%, transparent);
            isolation: isolate;
            animation: login-shell-in 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .login-shell::before {
            position: absolute;
            inset: 0 0 auto;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--sc-accent) 28%, var(--sc-accent) 72%, transparent);
            content: "";
            opacity: 0.86;
            pointer-events: none;
            z-index: 3;
        }

        .login-hero {
            position: relative;
            background: color-mix(in srgb, var(--sc-surface) 88%, var(--sc-accent) 12%);
        }

        .login-hero::after {
            position: absolute;
            right: 38px;
            bottom: 42px;
            width: 180px;
            height: 132px;
            border-right: 1px solid color-mix(in srgb, var(--sc-accent) 52%, transparent);
            border-bottom: 1px solid color-mix(in srgb, var(--sc-accent) 52%, transparent);
            content: "";
            opacity: 0.62;
            transform: skewX(-18deg);
            pointer-events: none;
        }

        .login-hero-grid {
            inset: 28px;
            border: 1px solid var(--login-panel-line);
            border-radius: 12px;
            opacity: 0.42;
        }

        .login-hero-content {
            max-width: 520px;
        }

        .login-brand-mark {
            box-shadow: 0 10px 22px rgba(13, 23, 40, 0.12);
        }

        .login-hero h1,
        .login-panel h2 {
            letter-spacing: 0;
        }

        .login-hero h1 {
            max-width: none;
            font-size: 2.875rem;
            line-height: 1.08;
        }

        .login-panel {
            position: relative;
            background: color-mix(in srgb, var(--sc-card-strong) 96%, var(--sc-accent) 4%);
        }

        .login-panel::before {
            position: absolute;
            inset: 32px 28px auto;
            height: 1px;
            background: var(--login-panel-line);
            content: "";
            opacity: 0.72;
        }

        .login-mobile-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 34px;
        }

        .login-form {
            max-width: 440px;
        }

        .login-alert {
            border-radius: 9px;
        }

        .login-input-wrap > .sc-icon {
            color: var(--sc-muted);
            transition: color 180ms ease, transform 180ms ease;
        }

        .login-input-wrap:focus-within > .sc-icon {
            color: var(--sc-accent);
            transform: translateY(-50%) scale(1.08);
        }

        .login-input {
            min-height: 52px;
            border-radius: 9px;
            background: color-mix(in srgb, var(--sc-card-strong) 88%, var(--sc-surface) 12%);
            box-shadow: inset 0 1px 0 color-mix(in srgb, var(--sc-card-strong) 72%, transparent);
        }

        .login-input:hover {
            border-color: color-mix(in srgb, var(--sc-accent) 36%, var(--sc-border) 64%);
        }

        .login-input:focus {
            border-color: var(--sc-accent);
            box-shadow: 0 0 0 4px var(--sc-focus-ring), inset 0 1px 0 color-mix(in srgb, var(--sc-card-strong) 72%, transparent);
        }

        .login-remember {
            min-height: 32px;
            padding-top: 2px;
        }

        .login-checkbox {
            accent-color: var(--sc-accent);
        }

        .login-submit {
            min-height: 52px;
            border-radius: 9px;
            box-shadow: 0 14px 28px var(--sc-accent-soft);
        }

        .login-submit:hover .sc-icon {
            transform: translateX(3px);
        }

        @keyframes login-shell-in {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 767px) {
            .sc-login-page {
                align-items: flex-start;
                padding-top: 88px;
                padding-bottom: 28px;
            }

            .login-shell {
                min-height: auto;
                border-radius: 14px;
            }

            .login-panel {
                padding: 34px 24px 38px;
            }

            .login-panel::before {
                inset: 18px 24px auto;
            }

            .login-panel > .mb-10 {
                margin-bottom: 34px;
            }
        }

        @media (min-width: 768px) {
            .login-mobile-brand {
                display: none;
            }
        }

        @media (min-width: 1280px) {
            .login-hero h1 {
                font-size: 3.25rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-shell,
            .login-input-wrap > .sc-icon,
            .login-submit .sc-icon {
                animation: none;
                transition: none;
            }

            .login-language-chevron {
                transition: none;
            }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const switcher = document.querySelector('[data-login-language-switcher]');
            const select = switcher?.querySelector('[data-language-select]');
            const trigger = switcher?.querySelector('[data-language-trigger]');
            const menu = switcher?.querySelector('[data-language-menu]');
            const options = switcher ? Array.from(switcher.querySelectorAll('[data-language-option]')) : [];

            if (!select || !trigger || !menu || options.length === 0) {
                return;
            }

            let activeIndex = 0;

            function selectedIndex() {
                const index = options.findIndex(option => option.dataset.languageOption === select.value);
                return index >= 0 ? index : 0;
            }

            function syncMenuFromSelect() {
                const index = selectedIndex();
                const selectedOption = options[index];
                const currentLabel = switcher.querySelector('[data-language-current]');

                activeIndex = index;
                if (currentLabel && selectedOption) {
                    currentLabel.textContent = selectedOption.textContent.trim();
                }

                options.forEach((option, optionIndex) => {
                    const isSelected = optionIndex === index;
                    option.setAttribute('aria-selected', String(isSelected));
                    option.dataset.active = String(optionIndex === activeIndex);
                });
            }

            function setActiveOption(index) {
                activeIndex = (index + options.length) % options.length;
                options.forEach((option, optionIndex) => {
                    option.dataset.active = String(optionIndex === activeIndex);
                });
                options[activeIndex].focus();
            }

            function closeMenu(restoreFocus) {
                menu.hidden = true;
                trigger.setAttribute('aria-expanded', 'false');
                if (restoreFocus) {
                    trigger.focus();
                }
            }

            function openMenu() {
                syncMenuFromSelect();
                menu.hidden = false;
                trigger.setAttribute('aria-expanded', 'true');
                setActiveOption(activeIndex);
            }

            function chooseOption(option) {
                const selectedLocale = option.dataset.languageOption;
                if (!selectedLocale) {
                    return;
                }

                select.value = selectedLocale;
                syncMenuFromSelect();
                closeMenu(false);
                select.dispatchEvent(new Event('change', { bubbles: true }));
            }

            trigger.addEventListener('click', () => {
                if (menu.hidden) {
                    openMenu();
                } else {
                    closeMenu(false);
                }
            });

            trigger.addEventListener('keydown', event => {
                if (event.key === 'Enter' || event.key === ' ' || event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                    event.preventDefault();
                    if (menu.hidden) {
                        openMenu();
                    } else if (event.key === 'Enter' || event.key === ' ') {
                        closeMenu(false);
                    }
                } else if (event.key === 'Escape' && !menu.hidden) {
                    event.preventDefault();
                    closeMenu(false);
                }
            });

            options.forEach((option, optionIndex) => {
                option.addEventListener('click', () => chooseOption(option));
                option.addEventListener('keydown', event => {
                    if (event.key === 'ArrowDown') {
                        event.preventDefault();
                        setActiveOption(optionIndex + 1);
                    } else if (event.key === 'ArrowUp') {
                        event.preventDefault();
                        setActiveOption(optionIndex - 1);
                    } else if (event.key === 'Home') {
                        event.preventDefault();
                        setActiveOption(0);
                    } else if (event.key === 'End') {
                        event.preventDefault();
                        setActiveOption(options.length - 1);
                    } else if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        chooseOption(option);
                    } else if (event.key === 'Escape') {
                        event.preventDefault();
                        closeMenu(true);
                    } else if (event.key === 'Tab') {
                        closeMenu(false);
                    }
                });
            });

            select.addEventListener('change', syncMenuFromSelect);
            document.addEventListener('click', event => {
                if (!switcher.contains(event.target)) {
                    closeMenu(false);
                }
            });

            syncMenuFromSelect();
            window.StreamCraftIcons?.refresh();
        });
    </script>
</body>
</html>
