<!DOCTYPE html>
<html th:lang="${currentLocaleTag}" lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="topbar(pageTitle, pageSubtitle)" data-shell-topbar class="sc-shell-topbar h-16 flex items-center justify-between px-6 lg:px-8 z-10 sticky top-0">
    <div class="sc-topbar-context flex items-center gap-3 min-w-0">
        <span class="sc-topbar-signal" aria-hidden="true"></span>
        <div class="min-w-0">
            <h1 th:attr="data-page-title=${pageTitle}" class="sc-topbar-title truncate" th:text="${pageTitle}">[[#{page.placeholder.title}]]</h1>
            <p th:if="${pageSubtitle != null and !#strings.isEmpty(pageSubtitle)}"
               class="sc-topbar-subtitle truncate mt-0.5"
               th:text="${pageSubtitle}">[[#{page.placeholder.subtitle}]]</p>
        </div>
    </div>

    <div class="sc-topbar-actions flex items-center gap-3 lg:gap-4">
        <div data-shell-language-switcher class="sc-language-control">
            <span id="topbar-language-label" class="sr-only" th:text="#{language.switcher.label}">Language</span>
            <select id="topbar-language-select"
                    data-language-select
                    class="sc-language-select"
                    tabindex="-1"
                    aria-hidden="true"
                    th:aria-label="#{language.switcher.label}"
                    aria-label="Language">
                <option value="zh-CN" th:selected="${currentLocaleTag == 'zh-CN'}" th:text="#{language.zhCN}">简体中文</option>
                <option value="en-US" th:selected="${currentLocaleTag == 'en-US'}" th:text="#{language.enUS}">English</option>
            </select>
            <button id="topbar-language-trigger"
                    type="button"
                    data-language-trigger
                    class="sc-language-trigger"
                    aria-haspopup="listbox"
                    aria-expanded="false"
                    aria-controls="topbar-language-menu"
                    aria-labelledby="topbar-language-label">
                <i data-lucide="languages" class="sc-icon sc-icon-sm sc-language-trigger-icon" aria-hidden="true"></i>
                <span data-language-current class="sc-language-current" th:if="${currentLocaleTag == 'zh-CN'}" th:text="#{language.zhCN}">简体中文</span>
                <span data-language-current class="sc-language-current" th:if="${currentLocaleTag == 'en-US'}" th:text="#{language.enUS}">English</span>
                <span data-language-current class="sc-language-current" th:unless="${currentLocaleTag == 'zh-CN' or currentLocaleTag == 'en-US'}" th:text="#{language.zhCN}">简体中文</span>
                <i data-lucide="chevron-down" class="sc-icon sc-icon-sm sc-language-chevron" aria-hidden="true"></i>
            </button>
            <div id="topbar-language-menu"
                 data-language-menu
                 class="sc-language-menu"
                 role="listbox"
                 aria-labelledby="topbar-language-label"
                 tabindex="-1"
                 hidden>
                <button type="button"
                        class="sc-language-option"
                        role="option"
                        data-language-option="zh-CN"
                        th:attr="aria-selected=${currentLocaleTag == 'zh-CN'}">
                    <span th:text="#{language.zhCN}">简体中文</span>
                    <i data-lucide="check" class="sc-icon sc-icon-sm sc-language-option-check" aria-hidden="true"></i>
                </button>
                <button type="button"
                        class="sc-language-option"
                        role="option"
                        data-language-option="en-US"
                        th:attr="aria-selected=${currentLocaleTag == 'en-US'}">
                    <span th:text="#{language.enUS}">English</span>
                    <i data-lucide="check" class="sc-icon sc-icon-sm sc-language-option-check" aria-hidden="true"></i>
                </button>
            </div>
        </div>

        <button id="theme-toggle" type="button" class="sc-btn-icon" th:aria-label="#{topbar.themeToggle}" th:title="#{topbar.themeToggle}" aria-label="Toggle theme" title="Toggle theme">
            <i id="theme-toggle-light-icon" data-lucide="sun" class="hidden sc-icon" aria-hidden="true"></i>
            <i id="theme-toggle-dark-icon" data-lucide="moon" class="hidden sc-icon" aria-hidden="true"></i>
        </button>

        <span class="sc-user-chip hidden md:inline-flex">
            <i data-lucide="circle-user-round" class="sc-icon sc-icon-sm text-[var(--sc-muted)]" aria-hidden="true"></i>
            <span class="text-sm font-medium" th:text="${displayName}">admin</span>
        </span>

        <form th:action="@{/logout}" method="post" class="inline-flex items-center">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="sc-btn-secondary px-4 py-2 text-sm">
                <i data-lucide="log-out" class="sc-icon sc-icon-sm" aria-hidden="true"></i>
                <span th:text="#{topbar.logout}">Sign out</span>
            </button>
        </form>
    </div>
</header>
</body>
</html>
