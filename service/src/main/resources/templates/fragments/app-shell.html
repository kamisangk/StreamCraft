<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="commonHead(documentTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${documentTitle} + ' - StreamCraft'">StreamCraft</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <script th:inline="javascript">
        window.STREAMCRAFT_LOCALE = /*[[${currentLocaleTag}]]*/ 'zh-CN';
        window.STREAMCRAFT_MESSAGES = /*[[${streamCraftMessages}]]*/ {};
    </script>
    <script th:src="@{/js/i18n.js}" src="/js/i18n.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sc-bg: #f3f6fa;
            --sc-surface: #eaf0f6;
            --sc-card: #f7f9fc;
            --sc-card-strong: #ffffff;
            --sc-border: #d6e0eb;
            --sc-border-soft: #e6edf4;
            --sc-text: #0d1728;
            --sc-text-body: #314158;
            --sc-muted: #6b7c92;
            --sc-muted-soft: #91a0b3;
            --sc-primary: #0d1728;
            --sc-primary-foreground: #ffffff;
            --sc-secondary: #ffffff;
            --sc-secondary-foreground: #0d1728;
            --sc-sidebar: #e8eef5;
            --sc-sidebar-foreground: #0d1728;
            --sc-sidebar-active: #d7e5f8;
            --sc-accent: #2f6df6;
            --sc-accent-soft: rgba(47, 109, 246, 0.13);
            --sc-focus-ring: rgba(47, 109, 246, 0.24);
            --sc-success: #0b9f6e;
            --sc-warning: #bf7a00;
            --sc-danger: #d83b4c;
            --sc-shadow: 0 12px 30px rgba(13, 23, 40, 0.07);
            --sc-shadow-soft: 0 3px 12px rgba(13, 23, 40, 0.05);
        }

        html.dark {
            --sc-bg: #080d17;
            --sc-surface: #0e1624;
            --sc-card: #121c2d;
            --sc-card-strong: #0d1522;
            --sc-border: #24344d;
            --sc-border-soft: #1a2940;
            --sc-text: #f4f7fb;
            --sc-text-body: #c6d1e1;
            --sc-muted: #8494ab;
            --sc-muted-soft: #60718a;
            --sc-primary: #f4f7fb;
            --sc-primary-foreground: #0b1220;
            --sc-secondary: #111b2b;
            --sc-secondary-foreground: #e8eef8;
            --sc-sidebar: #0b1320;
            --sc-sidebar-foreground: #e8eef8;
            --sc-sidebar-active: #182842;
            --sc-accent: #79a7ff;
            --sc-accent-soft: rgba(121, 167, 255, 0.17);
            --sc-focus-ring: rgba(121, 167, 255, 0.28);
            --sc-success: #51d59a;
            --sc-warning: #f3b34d;
            --sc-danger: #ff7281;
            --sc-shadow: 0 18px 46px rgba(0, 0, 0, 0.26);
            --sc-shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.18);
        }

        html {
            color-scheme: light;
            text-rendering: optimizeLegibility;
        }

        html.dark {
            color-scheme: dark;
        }

        body {
            min-width: 320px;
            font-family: 'Fira Sans', sans-serif;
            background: var(--sc-bg);
            color: var(--sc-text-body);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .sc-shell-page {
            min-height: 100dvh;
            isolation: isolate;
            position: relative;
            background: var(--sc-bg);
            color: var(--sc-text-body);
        }

        ::selection {
            background: var(--sc-accent);
            color: #ffffff;
        }

        :focus-visible {
            outline: 2px solid var(--sc-accent);
            outline-offset: 3px;
        }

        button:disabled,
        [aria-disabled="true"] {
            cursor: not-allowed;
        }

        .sc-icon {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            stroke-width: 1.8;
        }

        .sc-icon-sm {
            width: 16px;
            height: 16px;
        }

        .sc-icon-lg {
            width: 22px;
            height: 22px;
        }

        .sc-surface {
            background: var(--sc-surface);
            border: 1px solid var(--sc-border);
            border-radius: 10px;
        }

        .sc-card {
            background: var(--sc-card);
            border: 1px solid var(--sc-border);
            border-radius: 12px;
            box-shadow: var(--sc-shadow-soft);
        }

        .sc-card-strong {
            background: var(--sc-card-strong);
            border: 1px solid var(--sc-border);
            border-radius: 12px;
            box-shadow: var(--sc-shadow);
        }

        .sc-title {
            color: var(--sc-text);
            font-weight: 700;
            letter-spacing: 0;
        }

        .sc-muted {
            color: var(--sc-muted);
        }

        .sc-btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: var(--sc-primary);
            color: var(--sc-primary-foreground);
            font-size: 14px;
            font-weight: 600;
            line-height: 1;
            transition: background-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
        }

        .sc-btn-primary:hover {
            background: var(--sc-accent);
            box-shadow: 0 10px 22px var(--sc-accent-soft);
            transform: translateY(-1px);
        }

        .sc-btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid var(--sc-border);
            background: var(--sc-secondary);
            color: var(--sc-secondary-foreground);
            font-size: 14px;
            font-weight: 600;
            line-height: 1;
            transition: background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
        }

        .sc-btn-secondary:hover {
            background: var(--sc-surface);
            border-color: var(--sc-muted-soft);
            transform: translateY(-1px);
        }

        .sc-input {
            width: 100%;
            min-height: 40px;
            padding: 10px 14px;
            border: 1px solid var(--sc-border);
            border-radius: 10px;
            background: var(--sc-card-strong);
            color: var(--sc-text);
            font-size: 14px;
            line-height: 1.5;
        }

        .sc-input::placeholder {
            color: var(--sc-muted);
        }

        .sc-input:focus {
            outline: none;
            border-color: var(--sc-text);
            box-shadow: 0 0 0 4px var(--sc-focus-ring);
        }

        .sc-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border: 1px solid var(--sc-border);
            border-radius: 9999px;
            background: var(--sc-card);
            color: var(--sc-muted);
            font-size: 12px;
            font-weight: 600;
            line-height: 1.4;
        }

        .sc-shell-sidebar {
            width: clamp(208px, 22vw, 256px);
            flex: 0 0 clamp(208px, 22vw, 256px);
            position: relative;
            background: var(--sc-sidebar);
            color: var(--sc-sidebar-foreground);
            border-right: 1px solid var(--sc-border);
            box-shadow: 1px 0 0 var(--sc-border-soft);
        }

        .sc-sidebar-brand {
            position: relative;
        }

        .sc-brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            flex: 0 0 auto;
            border: 1px solid var(--sc-border);
            border-radius: 10px;
            background: var(--sc-card-strong);
            box-shadow: 0 6px 16px rgba(13, 23, 40, 0.08);
        }

        .sc-brand-mark img {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            object-fit: cover;
        }

        .sc-brand-copy {
            color: var(--sc-text);
            font-size: 17px;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: 0;
        }

        .sc-nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid transparent;
            border-radius: 12px;
            color: var(--sc-text-body);
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            position: relative;
            transition: background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
        }

        .sc-nav-link::before {
            width: 3px;
            height: 18px;
            margin-left: -12px;
            border-radius: 0 3px 3px 0;
            background: transparent;
            content: "";
        }

        .sc-nav-link:hover {
            background: var(--sc-card);
            color: var(--sc-text);
            transform: translateX(2px);
        }

        .sc-nav-link-active {
            background: var(--sc-sidebar-active);
            color: var(--sc-text);
            border-color: var(--sc-border);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
        }

        .sc-nav-link-active .sc-icon {
            color: var(--sc-accent);
        }

        .sc-nav-link-active::before {
            background: var(--sc-accent);
        }

        .sc-nav-link-active:hover {
            background: var(--sc-sidebar-active);
            color: var(--sc-text);
        }

        .sc-shell-topbar {
            min-height: 64px;
            background: rgba(255, 255, 255, 0.92);
            border-bottom: 1px solid var(--sc-border);
            backdrop-filter: blur(14px);
        }

        html.dark .sc-shell-topbar {
            background: rgba(19, 19, 19, 0.92);
        }

        .sc-topbar-title {
            color: var(--sc-text);
            font-size: 18px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: 0;
        }

        .sc-topbar-subtitle {
            color: var(--sc-muted);
            font-size: 13px;
            line-height: 1.4;
        }

        .sc-topbar-subtitle:empty {
            display: none;
        }

        .sc-topbar-context {
            min-width: 0;
        }

        .sc-topbar-signal {
            width: 3px;
            height: 22px;
            flex: 0 0 auto;
            border-radius: 2px;
            background: var(--sc-accent);
            box-shadow: 3px 0 0 var(--sc-accent-soft);
        }

        .sc-topbar-actions {
            flex: 0 0 auto;
        }

        .sc-language-control {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .sc-language-control .sc-icon {
            position: absolute;
            left: 12px;
            z-index: 1;
            pointer-events: none;
            color: var(--sc-muted);
        }

        .sc-language-control .sc-language-select {
            padding-left: 36px;
        }

        .sc-user-chip {
            align-items: center;
            gap: 8px;
            min-height: 40px;
            padding: 0 4px 0 10px;
            border-left: 1px solid var(--sc-border);
            color: var(--sc-text-body);
        }

        .sc-btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            flex: 0 0 auto;
            border-radius: 9999px;
            border: 1px solid var(--sc-border);
            background: var(--sc-card-strong);
            color: var(--sc-text-body);
            cursor: pointer;
            transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
        }

        .sc-btn-icon:hover {
            background: var(--sc-card);
            color: var(--sc-text);
            border-color: var(--sc-muted-soft);
            transform: translateY(-1px);
        }

        .sc-language-select {
            min-height: 40px;
            max-width: 132px;
            padding: 0 32px 0 12px;
            border: 1px solid var(--sc-border);
            border-radius: 10px;
            background: var(--sc-card-strong);
            color: var(--sc-text-body);
            font-size: 13px;
            font-weight: 600;
            line-height: 1.2;
        }

        .sc-language-select:focus {
            outline: none;
            border-color: var(--sc-accent);
            box-shadow: 0 0 0 4px var(--sc-focus-ring);
        }

        .sc-page-frame {
            background: var(--sc-bg);
        }

        .sc-page-content {
            padding: 20px;
            scrollbar-gutter: stable;
        }

        @media (min-width: 1024px) {
            .sc-page-content {
                padding: 32px 36px 40px;
            }
        }

        @media (max-width: 767px) {
            .sc-shell-sidebar {
                width: 72px;
                flex: 0 0 72px;
            }

            .sc-sidebar-brand {
                justify-content: center;
                padding-left: 0;
                padding-right: 0;
            }

            .sc-brand-mark {
                width: 40px;
                height: 40px;
            }

            .sc-brand-copy,
            .sc-shell-sidebar > div:last-child {
                display: none;
            }

            .sc-shell-sidebar nav {
                padding-left: 12px;
                padding-right: 12px;
            }

            .sc-nav-link {
                justify-content: center;
                padding-left: 0;
                padding-right: 0;
            }

            .sc-nav-link::before {
                display: none;
            }

            .sc-nav-link span {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }

            .sc-nav-link::after {
                display: block;
                position: absolute;
                left: calc(100% + 12px);
                top: 50%;
                z-index: 30;
                max-width: 180px;
                padding: 7px 9px;
                border: 1px solid var(--sc-border);
                border-radius: 8px;
                background: var(--sc-card-strong);
                box-shadow: var(--sc-shadow-soft);
                color: var(--sc-text);
                content: attr(title);
                font-size: 12px;
                font-weight: 600;
                line-height: 1.2;
                opacity: 0;
                pointer-events: none;
                transform: translateY(-50%) translateX(-4px);
                transition: opacity 0.16s ease, transform 0.16s ease;
                white-space: nowrap;
            }

            .sc-nav-link:hover::after,
            .sc-nav-link:focus-visible::after {
                opacity: 1;
                transform: translateY(-50%) translateX(0);
            }

            .sc-shell-topbar {
                padding-left: 16px;
                padding-right: 16px;
            }

            .sc-topbar-actions {
                gap: 8px;
            }

            .sc-shell-topbar form .sc-btn-secondary span {
                display: none;
            }

            .sc-shell-topbar form .sc-btn-secondary {
                width: 44px;
                padding-left: 0;
                padding-right: 0;
            }

            .sc-user-chip {
                display: none;
            }
        }

        @media (max-width: 479px) {
            .sc-topbar-title {
                max-width: 9rem;
            }

            .sc-topbar-subtitle {
                max-width: 9rem;
            }

            .sc-language-select {
                max-width: 112px;
            }
        }

        .sc-page-hero {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            padding: 28px;
            background: color-mix(in srgb, var(--sc-card-strong) 92%, var(--sc-accent) 8%);
            border: 1px solid var(--sc-border);
            border-radius: 14px;
            box-shadow: var(--sc-shadow);
        }

        @supports not (background: color-mix(in srgb, white 50%, black 50%)) {
            .sc-page-hero {
                background: var(--sc-card-strong);
            }
        }

        .sc-page-heading {
            color: var(--sc-text);
            font-size: clamp(30px, 3vw, 42px);
            font-weight: 700;
            line-height: 1.02;
            letter-spacing: -0.04em;
        }

        .sc-page-lead {
            max-width: 52rem;
            margin-top: 10px;
            color: var(--sc-muted);
            font-size: 15px;
            line-height: 1.65;
        }

        .sc-page-lead:empty {
            display: none;
        }

        .sc-summary-card {
            background: var(--sc-card-strong);
            border: 1px solid var(--sc-border);
            border-radius: 12px;
            box-shadow: var(--sc-shadow);
            padding: 20px;
        }

        .sc-panel-muted {
            background: var(--sc-surface);
            border: 1px solid var(--sc-border);
            border-radius: 12px;
        }

        .sc-card-interactive {
            background: var(--sc-card-strong);
            border: 1px solid var(--sc-border);
            border-radius: 12px;
            box-shadow: var(--sc-shadow);
            transition: background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
        }

        .sc-card-interactive:hover {
            background: var(--sc-card);
            border-color: var(--sc-muted-soft);
            box-shadow: var(--sc-shadow);
            transform: translateY(-2px);
        }

        .sc-filter-bar {
            background: var(--sc-surface);
            border: 1px solid var(--sc-border);
            border-radius: 12px;
            box-shadow: var(--sc-shadow);
            padding: 20px;
        }

        .sc-table-wrap {
            background: var(--sc-card-strong);
            border: 1px solid var(--sc-border);
            border-radius: 12px;
            box-shadow: var(--sc-shadow);
            overflow: hidden;
        }

        .sc-table-scroll {
            position: relative;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            scrollbar-gutter: stable;
        }

        .sc-data-table {
            border-spacing: 0;
        }

        .sc-data-table th,
        .sc-data-table td {
            font-variant-numeric: tabular-nums;
        }

        .sc-data-table thead th {
            background: var(--sc-surface);
        }

        .sc-data-table tbody tr {
            transition: background-color 0.18s ease;
        }

        .sc-data-table tbody tr:hover td:first-child {
            background: var(--sc-card);
        }

        .sc-data-table .sc-table-primary-cell {
            background: var(--sc-card-strong);
        }

        .sc-table-status-badge {
            min-height: 26px;
            white-space: nowrap;
        }

        .sc-table-action-group {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            flex-wrap: wrap;
        }

        .sc-input-icon-wrap {
            position: relative;
        }

        .sc-input-icon-wrap > .sc-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            z-index: 1;
            color: var(--sc-muted);
            pointer-events: none;
            transform: translateY(-50%);
        }

        .sc-input-icon-wrap > .sc-input {
            padding-left: 42px;
        }

        .sc-summary-card[data-summary-tone] {
            position: relative;
            overflow: hidden;
        }

        .sc-summary-card[data-summary-tone]::before {
            position: absolute;
            inset: 0 0 auto;
            height: 2px;
            background: var(--sc-border);
            content: "";
        }

        .sc-summary-card[data-summary-tone="running"]::before {
            background: var(--sc-success);
        }

        .sc-summary-card[data-summary-tone="stopped"]::before {
            background: var(--sc-warning);
        }

        .sc-summary-card[data-summary-tone="danger"]::before {
            background: var(--sc-danger);
        }

        @media (max-width: 767px) {
            .sc-data-table th:first-child,
            .sc-data-table td:first-child {
                position: sticky;
                left: 0;
                z-index: 2;
                background-clip: padding-box;
                box-shadow: 1px 0 0 var(--sc-border);
            }

            .sc-data-table thead th:first-child {
                z-index: 3;
            }
        }

        .sc-section-head {
            color: var(--sc-text);
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
        }

        .sc-subtle-label {
            color: var(--sc-muted);
            font-size: 12px;
            font-weight: 600;
            line-height: 1.4;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .sc-form-label {
            display: block;
            margin-bottom: 6px;
            color: var(--sc-muted);
            font-size: 12px;
            font-weight: 600;
            line-height: 1.4;
        }

        .sc-link-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--sc-text);
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            transition: color 0.18s ease;
        }

        .sc-link-action:hover {
            color: var(--sc-accent);
        }

        .sc-code {
            font-family: 'Fira Code', monospace;
            font-variant-numeric: tabular-nums;
        }

        .settings-password-card {
            border-radius: 12px;
        }

        .runtime-mode-segmented-control,
        .submission-mode-segmented-control {
            display: grid;
            gap: 6px;
            padding: 6px;
            border: 1px solid var(--sc-border);
            background: var(--sc-surface);
        }

        .runtime-mode-segmented-control {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            border-radius: 16px;
        }

        .submission-mode-segmented-control {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            border-radius: 9999px;
        }

        .runtime-mode-segmented-option,
        .submission-mode-segmented-option {
            border: 1px solid transparent;
            background: transparent;
            color: var(--sc-muted);
            transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
        }

        .runtime-mode-segmented-option {
            border-radius: 12px;
        }

        .submission-mode-segmented-option {
            border-radius: 9999px;
        }

        .runtime-mode-segmented-option:hover,
        .submission-mode-segmented-option:hover {
            color: var(--sc-text);
        }

        .runtime-mode-segmented-option.is-active,
        .submission-mode-segmented-option.is-active {
            border-color: var(--sc-border);
            background: var(--sc-card-strong);
            color: var(--sc-text);
            box-shadow: 0 1px 2px rgba(17, 24, 39, 0.05);
        }

        html.dark .runtime-mode-segmented-option.is-active,
        html.dark .submission-mode-segmented-option.is-active {
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        }

        .runtime-mode-segmented-option:focus-visible,
        .submission-mode-segmented-option:focus-visible {
            outline: none;
            border-color: var(--sc-text);
            box-shadow: 0 0 0 4px rgba(17, 17, 17, 0.08);
        }

        html.dark .runtime-mode-segmented-option:focus-visible,
        html.dark .submission-mode-segmented-option:focus-visible {
            box-shadow: 0 0 0 4px rgba(250, 250, 250, 0.1);
        }

        .sc-empty-state {
            background: var(--sc-surface);
            border: 1px dashed var(--sc-border);
            border-radius: 12px;
        }

        .sc-workbench-panel {
            background: var(--sc-card-strong);
            border: 1px solid var(--sc-border);
            box-shadow: var(--sc-shadow);
        }

        .sc-workbench-muted {
            background: var(--sc-surface);
            border: 1px solid var(--sc-border);
        }

        .sc-status-note {
            border-radius: 12px;
            border: 1px solid rgba(59, 130, 246, 0.16);
            background: var(--sc-accent-soft);
            color: var(--sc-accent);
        }

        html.dark .sc-status-note {
            border-color: rgba(121, 167, 255, 0.22);
            color: #cfe0ff;
        }

        .sc-scroll {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }

        html.dark .sc-scroll {
            scrollbar-color: #525252 transparent;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--sc-muted-soft);
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--sc-muted);
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
    <script>
        window.StreamCraftIcons = {
            refresh() {
                if (!window.lucide || typeof window.lucide.createIcons !== 'function') {
                    return;
                }

                window.lucide.createIcons({
                    attrs: {
                        'aria-hidden': 'true',
                        focusable: 'false'
                    }
                });
            }
        };
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggleBtn = document.getElementById('theme-toggle');
            const darkIcon = document.getElementById('theme-toggle-dark-icon');
            const lightIcon = document.getElementById('theme-toggle-light-icon');

            if (!themeToggleBtn) {
                return;
            }

            function updateThemeUI() {
                if (document.documentElement.classList.contains('dark')) {
                    darkIcon?.classList.remove('hidden');
                    lightIcon?.classList.add('hidden');
                } else {
                    lightIcon?.classList.remove('hidden');
                    darkIcon?.classList.add('hidden');
                }
            }

            themeToggleBtn.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
                updateThemeUI();
            });

            updateThemeUI();
            window.StreamCraftIcons?.refresh();
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('[data-language-select]').forEach(select => {
                select.addEventListener('change', event => {
                    const selectedLocale = event.target.value;
                    if (!selectedLocale) {
                        return;
                    }

                    const url = new URL(window.location.href);
                    url.searchParams.set('lang', selectedLocale);
                    window.location.assign(url.toString());
                });
            });
        });
    </script>
</head>
</html>
