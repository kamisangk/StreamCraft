<!DOCTYPE html>
<html th:lang="${currentLocaleTag}" lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(activeNav)" data-shell-sidebar class="sc-shell-sidebar">
    <div class="sc-sidebar-brand">
        <span class="sc-brand-mark">
            <img th:src="@{/brand-logo.png}" src="/brand-logo.png" alt="StreamCraft">
        </span>
        <div class="sc-brand-copy">
            <span class="sc-brand-name">StreamCraft</span>
            <span class="sc-brand-sub" aria-hidden="true">DATA TERMINAL</span>
        </div>
    </div>

    <div class="sc-sidebar-rail" aria-hidden="true">
        <span class="sc-rail-slash">//</span>
        <span class="sc-rail-text">MODULES</span>
        <span class="sc-rail-rule"></span>
    </div>

    <nav class="sc-sidebar-nav sc-scroll">
        <a th:href="@{/main}"
           data-nav-key="pipeline-monitor"
           th:attr="aria-current=${activeNav == 'pipeline-monitor'} ? 'page' : null"
           th:title="#{nav.pipelineMonitor}"
           title="Task Monitor"
           class="sc-nav-link"
           th:classappend="${activeNav == 'pipeline-monitor'} ? ' sc-nav-link-active' : ''">
            <span class="sc-nav-index" aria-hidden="true">01</span>
            <i data-lucide="layout-dashboard" class="sc-icon sc-icon-sm sc-nav-icon" aria-hidden="true"></i>
            <span class="sc-nav-label" th:text="#{nav.pipelineMonitor}">Task Monitor</span>
            <i data-lucide="chevron-right" class="sc-icon sc-icon-sm sc-nav-arrow" aria-hidden="true"></i>
        </a>

        <a th:href="@{/pipelines}"
           data-nav-key="pipelines"
           th:attr="aria-current=${activeNav == 'pipelines'} ? 'page' : null"
           th:title="#{nav.pipelines}"
           title="Pipelines"
           class="sc-nav-link"
           th:classappend="${activeNav == 'pipelines'} ? ' sc-nav-link-active' : ''">
            <span class="sc-nav-index" aria-hidden="true">02</span>
            <i data-lucide="git-branch" class="sc-icon sc-icon-sm sc-nav-icon" aria-hidden="true"></i>
            <span class="sc-nav-label" th:text="#{nav.pipelines}">Pipelines</span>
            <i data-lucide="chevron-right" class="sc-icon sc-icon-sm sc-nav-arrow" aria-hidden="true"></i>
        </a>

        <a th:href="@{/runtime-target}"
           data-nav-key="runtime-target"
           th:attr="aria-current=${activeNav == 'runtime-target'} ? 'page' : null"
           th:title="#{nav.runtimeTarget}"
           title="Flink"
           class="sc-nav-link"
           th:classappend="${activeNav == 'runtime-target'} ? ' sc-nav-link-active' : ''">
            <span class="sc-nav-index" aria-hidden="true">03</span>
            <i data-lucide="server" class="sc-icon sc-icon-sm sc-nav-icon" aria-hidden="true"></i>
            <span class="sc-nav-label" th:text="#{nav.runtimeTarget}">Flink</span>
            <i data-lucide="chevron-right" class="sc-icon sc-icon-sm sc-nav-arrow" aria-hidden="true"></i>
        </a>

        <a th:href="@{/settings}"
           data-nav-key="settings"
           th:attr="aria-current=${activeNav == 'settings'} ? 'page' : null"
           th:title="#{nav.settings}"
           title="Settings"
           class="sc-nav-link"
           th:classappend="${activeNav == 'settings'} ? ' sc-nav-link-active' : ''">
            <span class="sc-nav-index" aria-hidden="true">04</span>
            <i data-lucide="settings-2" class="sc-icon sc-icon-sm sc-nav-icon" aria-hidden="true"></i>
            <span class="sc-nav-label" th:text="#{nav.settings}">Settings</span>
            <i data-lucide="chevron-right" class="sc-icon sc-icon-sm sc-nav-arrow" aria-hidden="true"></i>
        </a>
    </nav>

    <footer class="sc-sidebar-foot">
        <span class="sc-foot-status">
            <span class="sc-foot-dot" aria-hidden="true"></span>
            <span class="sc-foot-text">ONLINE</span>
        </span>
        <span class="sc-foot-ver">v1.0.0-beta</span>
    </footer>
</aside>
</body>
</html>
