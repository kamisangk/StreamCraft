name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set Maven version from release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            printf 'Invalid release tag: %s (expected vMAJOR.MINOR.PATCH or a prerelease)\n' "${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
            -DnewVersion="${GITHUB_REF_NAME#v}" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Upload distribution package artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamcraft-dist-${{ github.ref_name }}
          path: |
            streamcraft-dist/target/*-bin.tar.gz
            streamcraft-dist/target/*-bin.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            streamcraft-dist/target/*-bin.tar.gz \
            streamcraft-dist/target/*-bin.zip \
            --title "StreamCraft ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
